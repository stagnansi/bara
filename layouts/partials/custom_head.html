<!-- Font: Inter (rsms.me) -->
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">

<!-- Font: IBM Plex Mono (Google Fonts) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

<style>
  :root {
    --font-main: Inter, sans-serif;
    --font-secondary: Inter, sans-serif;
    font-feature-settings: 'liga' 1, 'calt' 1; /* fix for Chrome */
    
    /* Warna Link (Bawaan) & Visited disamakan */
    --link-color: #0033cc;
    --visited-color: #0033cc;
  }
  
  @supports (font-variation-settings: normal) {
    :root { 
      --font-main: InterVariable, sans-serif;
      --font-secondary: InterVariable, sans-serif; 
    }
  }
  
  time, pre, code, kbd, samp {
    font-family: 'IBM Plex Mono', monospace;
  }
  
  /* Matikan Dark Mode: Paksa semua variabel ke warna Light Mode */
  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #fff;
      --heading-color: #222;
      --text-color: #444;
      --link-color: #0033cc;
      --visited-color: #0033cc;
      --blockquote-color: #222;
    }
  }

  /* User Select None untuk Judul, Nav, dan Footer */
  header .title, header nav, footer {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
  }
</style>
<style>
</style>
<style>
  main content > details:first-child {
    margin-top: 1em;
  }
</style>
<style>
  details > summary:hover {
    text-decoration: underline;
  }
</style>
